defaults: [../tracks/qwen25-7b-s1k.yaml, ../methods/iwc-gain.yaml]
name: iwc-gain-l05-lora
# the published ALG recipe (Table 6, Sec. 3.2): tau 1, lambda 0.5, c 2, epsilon 1e-8;
# _iwc.yaml's default temperature is the older IWC-Stable 2.0
iwc:
  temperature: 1.0
stages:
  answer_gain:
    args:
      # s1K samples reach 32k tokens: at the default 16384 later probes are skipped and those steps
      # silently get zero gain. 32768 is also Qwen2.5's position limit.
      max-model-len: 32768
  # optional (not in `pipeline`): how much of the trace and of the loss sits on answer-containing steps
  answer_stats:
    module: sgl.diagnostics.answer_steps
    creates: rebuttal/answer-steps/${track}/summary.json
    args:
      data-path: ${data_dir}/train-segmented.jsonl
      tokenizer: ${model.name}
      weights: ${data_dir}/train-${train_variant}.jsonl
      gains: ${data_dir}/signals/step_answer_gain.json
      output-dir: rebuttal/answer-steps/${track}
